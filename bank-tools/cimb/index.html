<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIMB Style Demo Receipt Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --panel:#15171b;
  --panel2:#0e1013;
  --line:#343840;
  --text:#f5f5f5;
  --muted:#9ca3ad;
  --red:#d71920;
}
body{
  margin:0;
  background:#090a0c;
  color:var(--text);
  font-family:"Open Sans",Arial,sans-serif;
}
.app-layout{
  max-width:1180px;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:390px 1fr;
  gap:18px;
  align-items:start;
}
.builder-panel{
  background:var(--panel);
  border:1px solid #272b31;
  border-radius:14px;
  padding:16px;
}
.builder-row{display:grid;gap:10px}
.builder-field{display:grid;gap:6px}
.builder-field label{
  font-size:11px;
  color:var(--muted);
}
.builder-row-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.input-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}
input,select{
  width:100%;
  height:38px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--panel2);
  color:#fff;
  outline:none;
  font-size:12px;
}
input:focus,select:focus{border-color:#666e78}
button{
  height:38px;
  border:0;
  border-radius:7px;
  cursor:pointer;
  font-weight:700;
  font-size:12px;
}
.btn-now,.btn-update{
  color:#fff;
  background:var(--red);
}
.btn-now.off{background:#2c3036}
.btn-reset{
  color:#fff;
  background:#22252a;
  border:1px solid #3b4048;
}
.btn-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.note{
  margin-top:2px;
  color:#9298a2;
  font-size:10px;
  line-height:1.5;
}

/* ===== Preview ===== */
.preview-panel{
  display:flex;
  justify-content:center;
  padding-top:2px;
}
.receipt-stage{
  width:min(100%,560px);
  overflow:auto;
  padding:2px;
}
.receipt{
  width:488px;
  height:251px;
  position:relative;
  background:#f7f7f7;
  color:#000;
  border:1px solid #777;
  font-family:"Open Sans",Arial,sans-serif;
  overflow:hidden;
  transform-origin:top left;
}
.status-bar{
  height:44px;
  background:#ececec;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  font-size:12px;
  white-space:nowrap;
}
.status-left{
  display:flex;
  align-items:center;
  gap:6px;
}
.check-icon{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#75bd83;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:10px;
  font-weight:700;
  line-height:1;
}
.success-text{
  color:#63ae72;
  font-weight:700;
}
.details{
  position:relative;
  height:207px;
  background:#f9f9f9;
  padding:19px 18px 12px;
}
.left-col{width:58%}
.to-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:13px;
}
.label{
  color:#666;
  font-size:12px;
  margin-bottom:1px;
}
.value{
  color:#000;
  font-size:14px;
  font-weight:700;
  line-height:1.25;
  margin-bottom:12px;
}
.amount-col{
  position:absolute;
  right:18px;
  top:18px;
  text-align:right;
}
.amount-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:4px;
}
.amount-row{
  display:flex;
  justify-content:flex-end;
  align-items:flex-start;
  gap:5px;
  line-height:1;
}
.currency{
  font-size:10px;
  font-weight:700;
  margin-top:6px;
}
.amount-main{
  font-size:19px;
  font-weight:700;
}
.sen{
  font-size:10px;
  vertical-align:top;
  position:relative;
  top:-5px;
  left:1px;
}
.charges{
  margin-top:7px;
  font-size:12px;
}
.charge-number{
  font-weight:700;
  margin-left:5px;
}
.charge-sen{
  font-size:8px;
  position:relative;
  top:-4px;
  left:1px;
}
.sample-watermark{
  position:absolute;
  left:50%;
  bottom:7px;
  transform:translateX(-50%);
  z-index:10;
  color:rgba(150,0,0,.55);
  border:1px solid rgba(150,0,0,.35);
  background:rgba(255,255,255,.72);
  border-radius:4px;
  padding:2px 6px;
  font-size:8px;
  font-weight:700;
  letter-spacing:.45px;
  pointer-events:none;
}
.blurred .private{filter:blur(5px)}

@media(max-width:860px){
  .app-layout{grid-template-columns:1fr}
  .builder-row-2{grid-template-columns:1fr}
  .btn-row{grid-template-columns:1fr 1fr}
  .receipt-stage{
    width:100%;
    overflow:auto;
  }
}
</style>
</head>
<body>

<div class="app-layout">
  <!-- LEFT BUILDER -->
  <aside class="builder-panel">
    <div class="builder-row">

      <div class="builder-field">
        <label>Bank</label>
        <select id="bank">
          <option>Maybank</option>
          <option selected>CIMB Bank</option>
          <option>Public Bank Berhad</option>
          <option>RHB Bank</option>
          <option>Hong Leong Bank</option>
          <option>AmBank</option>
          <option>Bank Islam Malaysia</option>
          <option>Bank Muamalat</option>
          <option>UOB Malaysia</option>
          <option>BSN</option>
          <option>Agrobank</option>
          <option>Affin Bank</option>
          <option>Bank Rakyat</option>
          <option>HSBC Malaysia</option>
          <option>Touch 'n Go eWallet</option>
          <option>GrabPay</option>
          <option>Gx Bank</option>
          <option>ShopeePay</option>
        </select>
      </div>

      <div class="builder-field">
        <label>Recipient Name</label>
        <div class="input-row">
          <input type="text" id="input-recipient" value="DEMO RECIPIENT" placeholder="Recipient Name">
          <button class="btn-now off" id="btn-auto-name" type="button">AUTO: OFF</button>
        </div>
      </div>

      <div class="builder-field">
        <label>Date &amp; Time</label>
        <div class="input-row">
          <input type="text" id="input-date" value="Tuesday 26 May 2026 at 15:47:48" placeholder="Date & Time">
          <button class="btn-now" id="btn-date" type="button">Now</button>
        </div>
      </div>

      <div class="builder-row-2">
        <div class="builder-field">
          <label>Reference Number 4 Digit Awal</label>
          <input type="text" id="input-ref4" value="5040" maxlength="4" inputmode="numeric">
        </div>
        <div class="builder-field">
          <label>Amount</label>
          <input type="text" id="input-amount" value="2500.00" placeholder="Fill Amount">
        </div>
      </div>

      <div class="builder-row-2">
        <div class="builder-field">
          <label>Account Number</label>
          <input type="text" id="input-account" value="0000000000" placeholder="Account Number">
        </div>
        <div class="builder-field">
          <label>Account Name</label>
          <input type="text" id="input-account-name" value="DEMO ACCOUNT" placeholder="Account Name">
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-reset" id="btn-reset" type="button">Reset</button>
        <button class="btn-update" id="btn-create" type="button">Create</button>
        <button class="btn-update" id="btn-blur" type="button">Blur</button>
        <button class="btn-update" id="btn-copy-image" type="button">Copy Image</button>
      </div>
    </div>
  </aside>

  <!-- RIGHT PREVIEW -->
  <main class="preview-panel">
    <div class="receipt-stage">
      <div class="receipt" id="receipt">

        <div class="status-bar">
          <div class="status-left">
            <div class="check-icon">✓</div>
            <span>
              <span class="success-text">Successful</span>
              Ref <span id="ref-number">504070409</span>
            </span>
          </div>
          <div id="transfer-date">Tuesday 26 May 2026 at 15:47:48</div>
        </div>

        <div class="details">
          <div class="left-col private">
            <div class="to-title">To</div>

            <div class="label">Account Number</div>
            <div class="value" id="account-number">0000000000</div>

            <div class="label">Account Name</div>
            <div class="value" id="accountNameValue">DEMO ACCOUNT</div>

            <div class="label">Recipient Name</div>
            <div class="value" id="recipient-name">DEMO RECIPIENT</div>
          </div>

          <div class="amount-col">
            <div class="amount-title">Amount</div>
            <div class="amount-row">
              <span class="currency">MYR</span>
              <span class="amount-main"><span id="main-amount">2,500.</span><span class="sen" id="main-sen">00</span></span>
            </div>
            <div class="charges">
              Bank charges
              <span class="charge-number">0.</span><span class="charge-sen">00</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const $ = id => document.getElementById(id);

function amountParts(v){
  let n = Number(String(v).replace(/,/g,''));
  if(!Number.isFinite(n)) n = 0;
  const fixed = n.toFixed(2).split('.');
  return {
    main: Number(fixed[0]).toLocaleString('en-MY') + '.',
    sen: fixed[1]
  };
}

function randomDigits(len){
  let out = '';
  for(let i=0;i<len;i++) out += Math.floor(Math.random()*10);
  return out;
}

function createReference(){
  const p = ($('input-ref4').value || '')
    .replace(/\D/g,'')
    .slice(0,4)
    .padEnd(4,'0');
  return p + randomDigits(5);
}

function updatePreview(newReference=true){
  $('transfer-date').textContent = $('input-date').value;
  $('recipient-name').textContent = $('input-recipient').value || 'DEMO RECIPIENT';
  $('account-number').textContent = $('input-account').value || '0000000000';
  $('accountNameValue').textContent = $('input-account-name').value || 'DEMO ACCOUNT';

  const a = amountParts($('input-amount').value);
  $('main-amount').textContent = a.main;
  $('main-sen').textContent = a.sen;

  if(newReference){
    $('ref-number').textContent = createReference();
  }
}

$('btn-create').addEventListener('click',()=>updatePreview(true));

$('btn-date').addEventListener('click',()=>{
  const d = new Date();
  $('input-date').value = d.toLocaleString('en-GB',{
    weekday:'long',
    day:'2-digit',
    month:'long',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit',
    second:'2-digit',
    hour12:false
  }).replace(',', '') ;
  updatePreview(false);
});

$('btn-blur').addEventListener('click',()=>{
  $('receipt').classList.toggle('blurred');
});

$('btn-reset').addEventListener('click',()=>{
  $('bank').value='CIMB Bank';
  $('input-recipient').value='DEMO RECIPIENT';
  $('input-date').value='Tuesday 26 May 2026 at 15:47:48';
  $('input-ref4').value='5040';
  $('input-amount').value='2500.00';
  $('input-account').value='0000000000';
  $('input-account-name').value='DEMO ACCOUNT';
  $('receipt').classList.remove('blurred');
  $('ref-number').textContent='504070409';
  updatePreview(false);
});

let autoName=false;
const demoNames=[
  'DEMO RECIPIENT',
  'SAMPLE CUSTOMER',
  'TEST ACCOUNT HOLDER',
  'DEMO USER'
];

$('btn-auto-name').addEventListener('click',()=>{
  autoName=!autoName;
  $('btn-auto-name').classList.toggle('off',!autoName);
  $('btn-auto-name').textContent=autoName?'AUTO: ON':'AUTO: OFF';
  if(autoName){
    $('input-recipient').value=demoNames[Math.floor(Math.random()*demoNames.length)];
    updatePreview(false);
  }
});

$('bank').addEventListener('change',()=>{
  /* dropdown is kept in builder without changing screenshot layout */
});

$('btn-copy-image').addEventListener('click',async()=>{
  if(typeof html2canvas==='undefined'){
    alert('html2canvas belum loaded.');
    return;
  }
  const canvas=await html2canvas($('receipt'),{
    scale:2,
    backgroundColor:'#f7f7f7'
  });

  canvas.toBlob(async blob=>{
    try{
      await navigator.clipboard.write([
        new ClipboardItem({'image/png':blob})
      ]);
      alert('Image copied.');
    }catch(err){
      const a=document.createElement('a');
      a.download='cimb-demo-sample.png';
      a.href=canvas.toDataURL('image/png');
      a.click();
    }
  });
});
</script>
</body>
</html>
