</main>



<script>

/* =====================================================
   REPOSITORY BASE URL

   GitHub:
   /game-asset-hub/

   Jadi tidak peduli page ini berada
   di root atau subfolder.
===================================================== */

function getRepoBase(){


  const host=
    location.hostname
    .toLowerCase();


  /*
    GitHub Pages project site
  */

  if(
    host.endsWith(
      ".github.io"
    )
  ){


    const parts=

      location.pathname
      .split("/")
      .filter(Boolean);


    if(
      parts.length
    ){

      return(
        "/" +
        parts[0] +
        "/"
      );

    }

  }


  /*
    Custom domain
  */

  return "/";

}



/* =====================================================
   BUILD FULL URL
===================================================== */

function repoURL(
  path=""
){


  const clean=

    String(
      path||""
    )

    .replace(
      /^\/+/,
      ""
    );


  return new URL(

    getRepoBase()+
    clean,

    location.origin

  ).href;

}



/* =====================================================
   ELEMENTS
===================================================== */

const tabsEl=

  document.getElementById(
    "tabs"
  );


const home=

  document.getElementById(
    "home"
  );


const viewer=

  document.getElementById(
    "viewer"
  );


const frame=

  document.getElementById(
    "frame"
  );


const viewerTitle=

  document.getElementById(
    "viewerTitle"
  );


const openNew=

  document.getElementById(
    "openNew"
  );


const homeButton=

  document.getElementById(
    "homeButton"
  );



/* =====================================================
   TAB DATA
===================================================== */

let openedTabs=[

  {

    key:"home",

    title:"Home",

    url:null

  }

];


let activeTab=
  "home";



/* =====================================================
   KEY
===================================================== */

function makeKey(
  value
){


  return String(
    value
  )

  .toLowerCase()

  .replace(
    /[^a-z0-9]+/g,
    "-"
  )

  .replace(
    /^-|-$/g,
    ""
  );

}



/* =====================================================
   SAVE OPENED TABS
===================================================== */

function saveTabs(){


  const save=

    openedTabs.filter(
      tab=>
        tab.key!=="home"
    );


  localStorage.setItem(

    "game-asset-open-tabs-v2",

    JSON.stringify(
      save
    )

  );

}



/* =====================================================
   LOAD OPENED TABS
===================================================== */

function loadSavedTabs(){


  try{


    const saved=

      JSON.parse(

        localStorage.getItem(
          "game-asset-open-tabs-v2"
        )

        ||

        "[]"

      );


    if(
      !Array.isArray(saved)
    ){

      return;

    }


    saved.forEach(
      tab=>{


        if(

          !tab ||

          !tab.key ||

          !tab.title ||

          !tab.url

        ){

          return;

        }


        if(

          openedTabs.some(
            item=>
              item.key===
              tab.key
          )

        ){

          return;

        }


        openedTabs.push(
          tab
        );


      }
    );


  }catch(error){}


}



/* =====================================================
   RENDER TAB BAR
===================================================== */

function renderTabs(){


  tabsEl.innerHTML=
    "";


  openedTabs.forEach(
    tab=>{


      const button=

        document.createElement(
          "button"
        );


      button.className=

        "tab"+
        (
          tab.key===activeTab
          ?" active"
          :""
        );



      const name=

        document.createElement(
          "span"
        );


      name.textContent=
        tab.title;


      button.appendChild(
        name
      );



      /* CLOSE BUTTON */

      if(
        tab.key!=="home"
      ){


        const close=

          document.createElement(
            "i"
          );


        close.textContent=
          "×";


        close.title=
          "Close";


        close.onclick=
        event=>{


          event.stopPropagation();


          closeTab(
            tab.key
          );


        };


        button.appendChild(
          close
        );


      }



      button.onclick=
      ()=>{


        activateTab(
          tab.key
        );


      };


      tabsEl.appendChild(
        button
      );


    }
  );

}



/* =====================================================
   OPEN TOOL
===================================================== */

function openTool(
  title,
  path
){


  const key=

    makeKey(
      title
    );


  const url=

    repoURL(
      path
    );


  const exists=

    openedTabs.some(
      tab=>
        tab.key===key
    );


  if(
    !exists
  ){


    openedTabs.push({

      key,

      title,

      url

    });


    saveTabs();

  }


  activateTab(
    key
  );

}



/* =====================================================
   ACTIVATE TAB
===================================================== */

function activateTab(
  key
){


  const tab=

    openedTabs.find(
      item=>
        item.key===key
    );


  if(
    !tab
  ){

    return;

  }


  activeTab=
    key;



  /* HOME */

  if(
    key==="home"
  ){


    home.classList.remove(
      "hidden"
    );


    viewer.classList.add(
      "hidden"
    );


    frame.src=
      "about:blank";


    frame.removeAttribute(
      "data-tab"
    );


  }



  /* TOOL */

  else{


    home.classList.add(
      "hidden"
    );


    viewer.classList.remove(
      "hidden"
    );


    viewerTitle.textContent=
      tab.title;


    openNew.href=
      tab.url;



    if(

      frame.getAttribute(
        "data-tab"
      )!==key

    ){


      frame.src=
        tab.url;


      frame.setAttribute(
        "data-tab",
        key
      );


    }


  }


  renderTabs();

}



/* =====================================================
   CLOSE TAB
===================================================== */

function closeTab(
  key
){


  const index=

    openedTabs.findIndex(
      tab=>
        tab.key===key
    );


  if(
    index===-1
  ){

    return;

  }


  const closingActive=

    activeTab===key;


  openedTabs.splice(
    index,
    1
  );


  saveTabs();



  if(
    closingActive
  ){

    activateTab(
      "home"
    );

  }


  else{

    renderTabs();

  }

}



/* =====================================================
   TOOL BUTTONS
===================================================== */

document
.querySelectorAll(
  ".tool"
)
.forEach(
  button=>{


    button.onclick=
    ()=>{


      openTool(

        button.dataset.title,

        button.dataset.path

      );


    };


  }
);



/* =====================================================
   HOME
===================================================== */

homeButton.onclick=
()=>{


  activateTab(
    "home"
  );


};



/* =====================================================
   START
===================================================== */

loadSavedTabs();

renderTabs();


</script>
