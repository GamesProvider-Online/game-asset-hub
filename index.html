<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Asset Hub</title>
  <style>
    :root{--bg:#0b0d12;--panel:#121620;--muted:#8f98aa;--text:#f4f6fb;--line:#222938;--accent:#f2c14e}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{font-size:24px;margin:0}.search{flex:1;max-width:420px}.search input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none}
    .providers{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:999px;cursor:pointer}.chip.active{border-color:var(--accent);color:var(--accent)}
    .meta{color:var(--muted);margin:8px 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#35405a}.thumb{aspect-ratio:1/1;background:#0f131b;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:contain}.body{padding:14px}.name{font-weight:700}.small{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;margin-top:12px}.btn{flex:1;text-align:center;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0e1219;color:var(--text);cursor:pointer;text-decoration:none;font-size:13px}.empty{padding:50px 0;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
<header><div class="wrap top"><h1>Game Asset Hub</h1><div class="search"><input id="q" placeholder="Search game, provider or category..." /></div></div></header>
<main class="wrap">
  <div id="providers" class="providers"></div>
  <div id="meta" class="meta">Loading assets...</div>
  <div id="grid" class="grid"></div>
</main>
<script>
let all=[]; let selected='ALL';
const fmt=s=>s.replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
async function load(){
  try{ const r=await fetch('data.json?'+Date.now()); all=await r.json(); renderProviders(); render(); }
  catch(e){ document.getElementById('meta').textContent='data.json not found yet. Push the repository once so GitHub Actions can generate it.'; }
}
function renderProviders(){
  const el=document.getElementById('providers'); const ps=['ALL',...new Set(all.map(x=>x.provider))];
  el.innerHTML=ps.map(p=>`<button class="chip ${p===selected?'active':''}" data-p="${p}">${fmt(p)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.p;renderProviders();render();});
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const items=all.filter(x=>(selected==='ALL'||x.provider===selected)&&(`${x.name} ${x.provider} ${x.category}`.toLowerCase().includes(q)));
  document.getElementById('meta').textContent=`${items.length} asset${items.length===1?'':'s'} shown`;
  const grid=document.getElementById('grid');
  if(!items.length){grid.innerHTML='<div class="empty">No assets found.</div>';return;}
  grid.innerHTML=items.map(x=>`<article class="card"><div class="thumb"><img loading="lazy" src="${encodeURI(x.path)}" alt="${x.name}"></div><div class="body"><div class="name">${fmt(x.name)}</div><div class="small">${fmt(x.provider)} · ${fmt(x.category)}</div><div class="actions"><button class="btn" onclick="navigator.clipboard.writeText(new URL('${x.path}',location.href).href);this.textContent='Copied'">Copy URL</button><a class="btn" href="${encodeURI(x.path)}" download>Open</a></div></div></article>`).join('');
}
document.getElementById('q').addEventListener('input',render); load();
</script>
</body>
</html>
