<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>
  Game Asset Studio
</title>

<link
  rel="stylesheet"
  href="styles.css">

</head>


<body>


<!-- =====================================================
     TOP
===================================================== -->

<header class="appbar">


  <div class="brandbar">


    <div class="brand">

      <strong>
        Game Asset Studio
      </strong>

      <span>
        Simple Workspace
      </span>

    </div>


    <button
      id="homeButton"
      class="home-button">

      HOME

    </button>


  </div>



  <!-- =================================================
       OPENED TABS
  ================================================= -->

  <div
    id="tabs"
    class="tabs">


    <button
      class="tab active"
      data-key="home">

      <span>
        Home
      </span>

    </button>


  </div>


</header>



<!-- =====================================================
     WORKSPACE
===================================================== -->

<main class="workspace">



<!-- =====================================================
     HOME
===================================================== -->

<section
  id="home"
  class="home">


  <div class="intro">


    <span>
      WORKSPACE
    </span>


    <h1>
      Game Asset Studio
    </h1>


    <p>

      Open the tool you need.
      Opened pages will stay available
      in the tab bar above.

    </p>


  </div>



  <!-- =================================================
       GAME
  ================================================= -->

  <section class="group">


    <div class="group-title">

      GAME TOOLS

    </div>



    <button
      class="tool"
      data-title="Game Assets"
      data-url="../">


      <div>

        <strong>
          Game Assets
        </strong>

        <small>
          Provider logos and game images
        </small>

      </div>


      <span>
        Open →
      </span>


    </button>



    <button
      class="tool"
      data-title="Tips Game"
      data-url="../tips-generator/">


      <div>

        <strong>
          Tips Generator
        </strong>

        <small>
          Generate random game list
        </small>

      </div>


      <span>
        Open →
      </span>


    </button>


  </section>



  <!-- =================================================
       BANK
  ================================================= -->

  <section class="group">


    <div class="group-title">

      BANK DEMO TOOLS

    </div>



    <button
      class="tool"
      data-title="Maybank2u"
      data-url="../bank-tools/mbb/">


      <div>

        <strong>
          Maybank2u
        </strong>

        <small>
          MBB demo builder
        </small>

      </div>


      <span>
        Open →
      </span>


    </button>



    <button
      class="tool"
      data-title="RHB Bank"
      data-url="../bank-tools/rhb/">


      <div>

        <strong>
          RHB Bank
        </strong>

        <small>
          RHB demo builder
        </small>

      </div>


      <span>
        Open →
      </span>


    </button>



    <button
      class="tool"
      data-title="CIMB Bank"
      data-url="../bank-tools/cimb/">


      <div>

        <strong>
          CIMB Bank
        </strong>

        <small>
          CIMB demo builder
        </small>

      </div>


      <span>
        Open →
      </span>


    </button>



    <button
      class="tool"
      data-title="GXB Bank"
      data-url="../bank-tools/gxb/">


      <div>

        <strong>
          GXB Bank
        </strong>

        <small>
          GXB demo builder
        </small>

      </div>


      <span>
        Open →
      </span>


    </button>


  </section>



  <!-- =================================================
       OTHER
  ================================================= -->

  <section class="group">


    <div class="group-title">

      OTHER TOOLS

    </div>



    <button
      class="tool"
      data-title="History"
      data-url="../history-tools/">


      <div>

        <strong>
          History Builder
        </strong>

        <small>
          Withdraw / Deposit history
        </small>

      </div>


      <span>
        Open →
      </span>


    </button>


  </section>


</section>



<!-- =====================================================
     OPENED PAGE
===================================================== -->

<section
  id="viewer"
  class="viewer hidden">


  <div class="viewer-head">


    <strong id="viewerTitle">

      Opened Tool

    </strong>


    <a
      id="openNew"
      href="#"
      target="_blank">

      Open New Tab ↗

    </a>


  </div>



  <iframe
    id="frame"
    title="Workspace">

  </iframe>


</section>


</main>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const tabsEl=
  document.getElementById(
    "tabs"
  );


const home=
  document.getElementById(
    "home"
  );


const viewer=
  document.getElementById(
    "viewer"
  );


const frame=
  document.getElementById(
    "frame"
  );


const viewerTitle=
  document.getElementById(
    "viewerTitle"
  );


const openNew=
  document.getElementById(
    "openNew"
  );


const homeButton=
  document.getElementById(
    "homeButton"
  );



/* =====================================================
   TAB DATA
===================================================== */

let openedTabs=[

  {
    key:"home",
    title:"Home",
    url:null
  }

];


let activeTab=
  "home";



/* =====================================================
   CREATE KEY
===================================================== */

function makeKey(
  value
){

  return String(
    value
  )

  .toLowerCase()

  .replace(
    /[^a-z0-9]+/g,
    "-"
  )

  .replace(
    /^-|-$/g,
    ""
  );

}



/* =====================================================
   SAVE
===================================================== */

function saveTabs(){

  const save=

    openedTabs.filter(
      tab=>
        tab.key!=="home"
    );


  localStorage.setItem(

    "game-asset-open-tabs",

    JSON.stringify(
      save
    )

  );

}



/* =====================================================
   LOAD SAVED TABS
===================================================== */

function loadSavedTabs(){

  try{


    const saved=

      JSON.parse(

        localStorage.getItem(
          "game-asset-open-tabs"
        )

        ||

        "[]"

      );


    if(
      !Array.isArray(saved)
    ){

      return;

    }


    saved.forEach(
      tab=>{


        if(

          !tab ||

          !tab.key ||

          !tab.title ||

          !tab.url

        ){

          return;

        }


        if(

          openedTabs.some(
            item=>
              item.key===
              tab.key
          )

        ){

          return;

        }


        openedTabs.push(
          tab
        );


      }
    );


  }catch(error){}

}



/* =====================================================
   DRAW TABS
===================================================== */

function renderTabs(){


  tabsEl.innerHTML=
    "";


  openedTabs.forEach(
    tab=>{


      const button=

        document.createElement(
          "button"
        );


      button.className=

        "tab"+
        (
          tab.key===activeTab
          ?" active"
          :""
        );


      const name=

        document.createElement(
          "span"
        );


      name.textContent=
        tab.title;


      button.appendChild(
        name
      );



      /* CLOSE */

      if(
        tab.key!=="home"
      ){


        const close=

          document.createElement(
            "i"
          );


        close.textContent=
          "×";


        close.onclick=
        event=>{


          event.stopPropagation();


          closeTab(
            tab.key
          );


        };


        button.appendChild(
          close
        );


      }



      button.onclick=
      ()=>{


        activateTab(
          tab.key
        );


      };


      tabsEl.appendChild(
        button
      );


    }
  );

}



/* =====================================================
   OPEN TOOL
===================================================== */

function openTool(
  title,
  url
){


  const key=
    makeKey(
      title
    );


  const exists=

    openedTabs.some(
      tab=>
        tab.key===key
    );


  if(
    !exists
  ){


    openedTabs.push({

      key,

      title,

      url

    });


    saveTabs();

  }


  activateTab(
    key
  );

}



/* =====================================================
   ACTIVATE TAB
===================================================== */

function activateTab(
  key
){


  const tab=

    openedTabs.find(
      item=>
        item.key===key
    );


  if(
    !tab
  ){

    return;

  }


  activeTab=
    key;



  /* HOME */

  if(
    key==="home"
  ){


    home.classList.remove(
      "hidden"
    );


    viewer.classList.add(
      "hidden"
    );


    frame.src=
      "about:blank";


    frame.removeAttribute(
      "data-tab"
    );


  }



  /* PAGE */

  else{


    home.classList.add(
      "hidden"
    );


    viewer.classList.remove(
      "hidden"
    );


    viewerTitle.textContent=
      tab.title;


    openNew.href=
      tab.url;



    /*
      Only reload iframe
      when changing page.
    */

    if(

      frame.getAttribute(
        "data-tab"
      )!==key

    ){


      frame.src=
        tab.url;


      frame.setAttribute(
        "data-tab",
        key
      );


    }


  }


  renderTabs();

}



/* =====================================================
   CLOSE TAB
===================================================== */

function closeTab(
  key
){


  const index=

    openedTabs.findIndex(
      tab=>
        tab.key===key
    );


  if(
    index===-1
  ){

    return;

  }


  const closingActive=

    activeTab===key;


  openedTabs.splice(
    index,
    1
  );


  saveTabs();



  if(
    closingActive
  ){

    activateTab(
      "home"
    );

  }

  else{

    renderTabs();

  }

}



/* =====================================================
   TOOL BUTTONS
===================================================== */

document
.querySelectorAll(
  ".tool"
)
.forEach(
  button=>{


    button.onclick=
    ()=>{


      openTool(

        button.dataset.title,

        button.dataset.url

      );


    };


  }
);



/* =====================================================
   HOME BUTTON
===================================================== */

homeButton.onclick=
()=>{

  activateTab(
    "home"
  );

};



/* =====================================================
   START
===================================================== */

loadSavedTabs();

renderTabs();

</script>


</body>

</html>
