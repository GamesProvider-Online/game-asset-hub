<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Asset Hub</title>
<style>
:root{
  --bg:#090c11; --panel:#111620; --panel2:#161d2a; --line:#252d3d;
  --text:#f5f7fb; --muted:#929bad; --accent:#f0c04c; --accent2:#ffe49a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
header{position:sticky;top:0;z-index:30;background:rgba(9,12,17,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:auto;padding:20px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.brand h1{margin:0;font-size:25px}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
.search{width:min(430px,100%)}.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:13px 16px;border-radius:12px;outline:none}
.search input:focus{border-color:#56627a}
.breadcrumb{display:flex;align-items:center;gap:8px;margin:17px 0;color:var(--muted);font-size:14px}
.crumb-btn{background:none;border:0;color:var(--accent);padding:0;cursor:pointer}
.heading-row{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin:22px 0 16px}
.heading-row h2{margin:0;font-size:22px}.count{font-size:13px;color:var(--muted)}
.providers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.provider{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:.18s;min-height:230px}
.provider:hover{transform:translateY(-2px);border-color:#445069}
.provider-logo{height:145px;background:var(--panel2);border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px}
.provider-logo img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.provider h3{margin:14px 0 4px;font-size:18px}.provider small{color:var(--muted)}
.category-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer}
.chip.active{border-color:var(--accent);color:var(--accent)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s}
.card:hover{transform:translateY(-2px);border-color:#445069}
.thumb{aspect-ratio:1/1;background:var(--panel2);padding:8px;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.card-body{padding:13px}.game-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.btn{border:1px solid var(--line);background:#0d1118;color:var(--text);border-radius:9px;padding:8px 9px;cursor:pointer;text-align:center;text-decoration:none;font-size:12px}
.tips-btn{grid-column:1/-1;color:var(--accent2)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 20px;line-height:1.8}
.notice{background:#111827;border:1px solid #26334b;border-radius:14px;padding:14px 16px;color:#cbd5e1;font-size:13px;line-height:1.6;margin:16px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal{width:min(680px,100%);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.modal-head h3{margin:0}
.close{background:none;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 10px;cursor:pointer}
pre{white-space:pre-wrap;word-wrap:break-word;color:#d8deea;font-family:inherit;line-height:1.65;background:#0b0f16;padding:15px;border-radius:12px;border:1px solid var(--line)}
@media(max-width:620px){.wrap{padding:15px}.search{width:100%}.providers,.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.provider{min-height:190px;padding:11px}.provider-logo{height:112px}.card-body{padding:10px}}
</style>
</head>
<body>
<header>
  <div class="wrap header-row">
    <div class="brand"><h1>Game Asset Hub</h1><p>Folder-based image library</p></div>
    <div class="search"><input id="search" placeholder="Search provider or game..."></div>
  </div>
</header>

<main class="wrap">
  <div id="breadcrumb" class="breadcrumb"></div>
  <div id="notice" class="notice">Loading assets from this GitHub repository...</div>
  <div class="heading-row"><h2 id="title">Providers</h2><div id="count" class="count"></div></div>
  <div id="categories" class="category-row"></div>
  <div id="content"></div>
</main>

<div id="modalBg" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Tips</h3><button id="closeModal" class="close">Close</button></div>
    <pre id="modalText">Loading...</pre>
  </div>
</div>

<script>
const IMG_EXTS=['png','jpg','jpeg','webp','gif','svg','avif'];
const LOGO_NAMES=['provider-logo.png','provider-logo.jpg','provider-logo.jpeg','provider-logo.webp','provider-logo.gif','provider-logo.svg','provider-logo.avif'];
let games=[], logos={}, textFiles=new Set(), currentProvider=null, currentCategory='ALL';

function pretty(s){
  return decodeURIComponent(String(s||'')).replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function repoInfo(){
  const host=location.hostname.toLowerCase();
  const parts=location.pathname.split('/').filter(Boolean);
  if(host.endsWith('.github.io') && parts.length){
    return {owner:host.replace('.github.io',''),repo:parts[0]};
  }
  return {owner:'GamesProvider-Online',repo:'game-asset-hub'};
}
async function loadTree(){
  const {owner,repo}=repoInfo();
  const meta=await fetch(`https://api.github.com/repos/${owner}/${repo}`);
  if(!meta.ok) throw new Error(`Cannot read GitHub repo (${meta.status})`);
  const info=await meta.json();
  const branch=info.default_branch || 'main';
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
  if(!r.ok) throw new Error(`Cannot scan files (${r.status})`);
  const data=await r.json();
  return data.tree||[];
}
async function init(){
  try{
    const tree=await loadTree();
    const blobs=tree.filter(x=>x.type==='blob' && x.path.startsWith('assets/'));
    blobs.forEach(x=>{
      const low=x.path.toLowerCase();
      const parts=x.path.split('/');
      if(parts.length<3) return;
      const provider=parts[1];
      const filename=parts[parts.length-1];
      const ext=(filename.split('.').pop()||'').toLowerCase();

      if(parts.length===3 && LOGO_NAMES.includes(filename.toLowerCase())){
        logos[provider]=x.path; return;
      }
      if(ext==='txt'){ textFiles.add(x.path); return; }
      if(!IMG_EXTS.includes(ext)) return;
      if(parts.length<4) return;

      const category=parts[2];
      games.push({
        provider,category,
        filename,
        name:filename.replace(/\.[^.]+$/,''),
        path:x.path
      });
    });
    games.sort((a,b)=>a.provider.localeCompare(b.provider)||a.category.localeCompare(b.category)||a.name.localeCompare(b.name));
    document.getElementById('notice').style.display='none';
    render();
  }catch(e){
    document.getElementById('notice').innerHTML='<b>Could not scan assets.</b><br>'+esc(e.message)+'<br><br>Make sure the repository is PUBLIC and GitHub Pages is opened from this repository.';
    render();
  }
}
function providerStats(){
  const map={};
  games.forEach(g=>{map[g.provider]=(map[g.provider]||0)+1});
  Object.keys(logos).forEach(p=>{if(!(p in map))map[p]=0});
  return map;
}
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const content=document.getElementById('content');
  const crumbs=document.getElementById('breadcrumb');
  const cats=document.getElementById('categories');

  if(!currentProvider){
    document.getElementById('title').textContent='Providers';
    cats.innerHTML='';
    crumbs.innerHTML='<span>Home</span>';
    const stats=providerStats();
    let providers=Object.keys(stats).sort().filter(p=>{
      if(!q) return true;
      return p.toLowerCase().includes(q) || games.some(g=>g.provider===p && (`${g.name} ${g.category}`).toLowerCase().includes(q));
    });
    document.getElementById('count').textContent=`${providers.length} provider${providers.length===1?'':'s'} · ${games.length} game asset${games.length===1?'':'s'}`;
    if(!providers.length){
      content.innerHTML='<div class="empty">No providers found.<br>Upload images into <b>assets/PROVIDER/CATEGORY/</b>.</div>'; return;
    }
    content.innerHTML='<div class="providers">'+providers.map(p=>`
      <article class="provider" data-provider="${esc(p)}">
        <div class="provider-logo">${logos[p]?`<img src="${encodeURI(logos[p])}" alt="${esc(pretty(p))}">`:`<div>${esc(pretty(p))}</div>`}</div>
        <h3>${esc(pretty(p))}</h3><small>${stats[p]} game asset${stats[p]===1?'':'s'}</small>
      </article>`).join('')+'</div>';
    content.querySelectorAll('.provider').forEach(el=>el.onclick=()=>{currentProvider=el.dataset.provider;currentCategory='ALL';document.getElementById('search').value='';render();scrollTo({top:0,behavior:'smooth'});});
    return;
  }

  crumbs.innerHTML=`<button class="crumb-btn" id="homeCrumb">Home</button><span>›</span><span>${esc(pretty(currentProvider))}</span>`;
  document.getElementById('homeCrumb').onclick=()=>{currentProvider=null;currentCategory='ALL';document.getElementById('search').value='';render();};

  document.getElementById('title').textContent=pretty(currentProvider);
  const providerGames=games.filter(g=>g.provider===currentProvider);
  const categoryList=['ALL',...new Set(providerGames.map(g=>g.category))];
  cats.innerHTML=categoryList.map(c=>`<button class="chip ${currentCategory===c?'active':''}" data-cat="${esc(c)}">${c==='ALL'?'All':esc(pretty(c))}</button>`).join('');
  cats.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{currentCategory=b.dataset.cat;render();});

  const visible=providerGames.filter(g=>(currentCategory==='ALL'||g.category===currentCategory) && (`${g.name} ${g.category}`).toLowerCase().includes(q));
  document.getElementById('count').textContent=`${visible.length} asset${visible.length===1?'':'s'}`;

  if(!visible.length){
    content.innerHTML='<div class="empty">No matching game assets.</div>'; return;
  }
  content.innerHTML='<div class="games">'+visible.map(g=>{
    const stem=g.path.replace(/\.[^.]+$/,'');
    const tipPath=stem+'.txt';
    const hasTips=textFiles.has(tipPath);
    return `<article class="card">
      <div class="thumb"><img loading="lazy" src="${encodeURI(g.path)}" alt="${esc(pretty(g.name))}"></div>
      <div class="card-body">
        <div class="game-name">${esc(pretty(g.name))}</div>
        <div class="sub">${esc(pretty(g.category))}</div>
        <div class="actions">
          <button class="btn copy" data-path="${esc(g.path)}">Copy URL</button>
          <a class="btn" href="${encodeURI(g.path)}" target="_blank" rel="noopener">Open</a>
          ${hasTips?`<button class="btn tips-btn" data-tip="${esc(tipPath)}" data-name="${esc(pretty(g.name))}">View Tips / Notes</button>`:''}
        </div>
      </div>
    </article>`;
  }).join('')+'</div>';

  content.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{
    const url=new URL(b.dataset.path,location.href).href;
    try{await navigator.clipboard.writeText(url);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy URL',1200);}
    catch(e){prompt('Copy URL:',url)}
  });
  content.querySelectorAll('.tips-btn').forEach(b=>b.onclick=()=>openTips(b.dataset.tip,b.dataset.name));
}
async function openTips(path,name){
  document.getElementById('modalTitle').textContent=name+' — Tips / Notes';
  document.getElementById('modalText').textContent='Loading...';
  document.getElementById('modalBg').style.display='flex';
  try{
    const r=await fetch(encodeURI(path)+'?v='+Date.now());
    document.getElementById('modalText').textContent=r.ok?await r.text():'Tips file could not be loaded.';
  }catch(e){document.getElementById('modalText').textContent='Tips file could not be loaded.'}
}
document.getElementById('closeModal').onclick=()=>document.getElementById('modalBg').style.display='none';
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')e.currentTarget.style.display='none'};
document.getElementById('search').addEventListener('input',render);
init();
</script>
</body>
</html>
